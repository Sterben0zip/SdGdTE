<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<script src="../js/comun.js"></script>
	<script src="../js/tareas.js"></script>
	<script src="../js/materias.js"></script>
	<title>Tareas</title>
</head>

<body>
	<div class="p-5 bg-dark text-white text-center">
		<h1>Proyecto SQL</h1>
		<p>Control escolar</p>
	</div>

	<nav class="navbar navbar-expand-sm bg-secondary navbar-dark">
		<div class="container-fluid" id="navDiv">
			<ul class="navbar-nav">
				<li class="nav-item">
					<a class="nav-link" onclick="navegar('inicio')" href="#">Inicio</a>
				</li>
				<li class="nav-item">
					<a class="nav-link active" onclick="navegar('tareas')" href="#">Tareas</a>
				</li>
				<li class="nav-item">
					<a class="nav-link" onclick="navegar('salir')" href="#">Cerrar sesion</a>
				</li>
			</ul>
		</div>
	</nav>

	<div  class="d-flex justify-content-center">
		<div id="spinn" hidden class="spinner-grow text-warning" role="status">
			<span class="visually-hidden">Loading...</span>
		</div>
	</div>

	<div style="margin: 15px;">
		<div style="margin: auto; width: 80%;">
			<div style="margin: 15px 0px;">
				<button type="button" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#modalCrear">
					Agregar tarea
				</button>
			</div>
			<table class="table table-striped">
				<thead>
					<tr>
						<th hidden>Id</th>
						<th>Nombre</th>
						<th>Fecha de entrega</th>
						<th>Estado</th>
						<th>Materia</th>
						<th>Acciones</th>
					</tr>
				</thead>
				<tbody id="tareas">
				</tbody>
			</table>
		</div>
		<div class="modal" id="modalCrear">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title">Tarea</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
					</div>
					<div class="modal-body">
						<div class="mb-3">
							<label for="nombre" class="form-label">Titulo:</label>
							<input type="text" class="form-control" id="titulo" name="titulo">
						</div>
						<div class="mb-3">
							<label for="fecha" class="form-label">Fecha de entrega:</label>
							<input type="date" class="form-control" id="fecha" name="fecha">
						</div>
						<div class="mb-3">
							<label for="fecha" class="form-label">Descripcion:</label>
							<input type="text" class="form-control" id="descripcion" name="descripcion">
						</div>
						<div class="mb-3">
							<label for="estado" class="form-label">Materia:</label>
							<select class="form-select" name="materias" id="materias">
								<option value="0">Seleccione una materia</option>
							</select>
						</div>
						<div class="float-end">
							<button id="btnCrear" type="button" class="btn btn-success" onclick="guardarTarea();">
								Guardar
							</button>
						</div>
					</div>
				</div>
			</div>
		</div>

		<div class="modal" id="modalEditar">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title">Editar Tarea</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
					</div>
					<div class="modal-body">
						<form>
							<div class="mb-3">
								<label hidden for="idEditar" class="form-label">Id:</label>
								<input hidden disabled type="text" class="form-control" id="idEditar" name="idEditar">
							</div>
							<div class="mb-3">
								<label for="nombre" class="form-label">Titulo:</label>
								<input type="text" class="form-control" id="tituloEditar" name="tituloEditar">
							</div>
							<div class="mb-3">
								<label for="fecha" class="form-label">Fecha de entrega:</label>
								<input type="date" class="form-control" id="fechaEditar" name="fechaEditar">
							</div>
							<div class="mb-3">
								<label for="fecha" class="form-label">Descripcion:</label>
								<input type="text" class="form-control" id="descripcionEditar" name="descripcionEditar">
							</div>
							<div class="mb-3">
								<label for="estado" class="form-label">Materia:</label>
								<select class="form-select" name="materiasEditar" id="materiasEditar">
									<option value="0">Seleccione una materia</option>
								</select>
							</div>
							<div class="mb-3">
								<label for="completadoEditar" class="form-label">Completado:</label>
								<input type="checkbox" id="completadoEditar" onclick="toggleCheck(this)"
									name="completadoEditar">
							</div>
							<div class="float-end">
								<button id="btnActualizar" type="button" class="btn btn-success"
									onclick="actualizarTarea();">
									Guardar
								</button>
								<button hidden id="btnEliminar" type="button" class="btn btn-danger"
									onclick="confirmarEliminar();">
									Eliminar
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script>
		$(document).ready(function () {
			carga();
		});
	</script>
</body>

</html>
