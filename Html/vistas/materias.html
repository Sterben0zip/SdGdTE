<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<script src="../js/comun.js"></script>
	<script src="../js/materias.js"></script>
	<title>Tareas</title>
</head>

<body>
	<div class="p-5 bg-dark text-white text-center">
		<h1>Proyecto SQL</h1>
		<p>Control escolar</p>
	</div>

	<nav class="navbar navbar-expand-sm bg-secondary navbar-dark">
		<div class="container-fluid" id="navDiv">
			<ul class="navbar-nav">
				<li class="nav-item">
					<a class="nav-link" href="index.html">Regresar</a>
				</li>
			</ul>
		</div>
	</nav>

	<div style="margin: auto; width: 80%;">
		<div style="margin: 15px 0px;">
			<button type="button" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#modalMateria">
				Agregar materia
			</button>
		</div>
		<table class="table table-striped">
			<thead>
				<tr>
					<th hidden>Id</th>
					<th>Nombre</th>
					<th>Descripcion</th>
				</tr>
			</thead>
			<tbody id="materias">
			</tbody>
		</table>
	</div>

	<div class="modal" id="modalMateria">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">Tarea</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body">
					<form>
						<div class="mb-3">
							<label for="nombre" class="form-label">Materia:</label>
							<input type="text" class="form-control" id="nombre" name="nombre">
						</div>

						<div class="mb-3">
							<label for="fecha" class="form-label">Descripcion:</label>
							<input type="text" class="form-control" id="descripcion" name="descripcion">
						</div>
						<div class="float-end">
							<button type="button" class="btn btn-success" onclick="agregarMateria();">
								Guardar
							</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<script>
		$(document).ready(function() {
			enlistarMaterias();
		});
	</script>
</body>
</html>
