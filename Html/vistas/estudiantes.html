<!DOCTYPE html>
<html lang="en">

<head>
	<title>Proyecto SQL - Control escolar</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<script src="../js/estudiantes.js"></script>
	<script src="../js/comun.js"></script>
</head>

<body>
	<div class="p-5 bg-dark text-white text-center">
		<h1>Proyecto SQL</h1>
		<p>Control escolar</p>
	</div>

	<nav class="navbar navbar-expand-sm bg-secondary navbar-dark">
		<div class="container-fluid" id="navDiv">
			<ul class="navbar-nav">
				<li class="nav-item">
					<a class="nav-link active" onclick="navegar('inicio')" href="#">Inicio</a>
				</li>
				<li class="nav-item">
					<a class="nav-link" onclick="navegar('tareas')" href="#">Tareas</a>
				</li>
				<li class="nav-item">
					<a class="nav-link" onclick="navegar('salir')" href="#">Cerrar sesion</a>
				</li>
			</ul>
		</div>
	</nav>

	<div class="row">
		<div class="col-sm-4">
			<div style="margin: 15px;">
				<h5>Datos del estudiante</h5>
			</div>

			<div style="margin: 15px;">
				<div class="card" style="width:400px">
					<img class="card-img-top" src="https://www.w3schools.com/bootstrap5/img_avatar1.png"
						alt="Card image">
					<div class="card-body">
						<h4 id="nombreEstudiante" class="card-title">John Doe</h4>
						<p id="correoEstudiante" class="card-text">somemail@example.com</p>
						<div class="float-end">
							<a href="#" onclick="navegar('tareas')"><span class="material-icons">list</span></a>
						</div>
						<div class="float-end">
							<a href="#" onclick="editarAlumno()"><span class="material-icons">edit</span></a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div class="modal" id="modalEditar">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">Editar datos</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body">
					<div class="mb-3">
						<label hidden for="idEditar" class="form-label">Id:</label>
						<input hidden disabled type="text" class="form-control" id="idEditar" name="idEditar">
					</div>
					<div class="mb-3">
						<label for="nombreEditar" class="form-label">Nombre:</label>
						<input type="text" class="form-control" id="nombreEditar" name="nombreEditar">
					</div>
					<div class="mb-3">
						<label for="correoEditar" class="form-label">Correo:</label>
						<input type="email" class="form-control" id="correoEditar" name="correoEditar">
					</div>
					<div class="mb-3">
						<label for="passEditar" class="form-label">Contraseña:</label>
						<input type="password" class="form-control" id="passEditar" name="passEditar">
					</div>
					<div class="float-end">
						<button id="btnActualizar" type="button" class="btn btn-success" onclick="actualizarDatos();">
							Guardar
						</button>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script>
		$(document).ready(function () {
			verEstudiante();
		});
	</script>
</body>

</html>
